<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56616a"/></marker></defs>
  <text x="10" y="34" font-size="20" font-weight="700" letter-spacing="2" fill="#13857a">OFFLINE</text>
  <g font-size="21" fill="#1d262d" text-anchor="middle">
    <rect x="10" y="50" width="160" height="70" rx="10" fill="#d3eeea" stroke="#13857a"/><text x="90" y="82">Fixed</text><text x="90" y="107">test set</text>
    <rect x="220" y="50" width="160" height="70" rx="10" fill="#d3eeea" stroke="#13857a"/><text x="300" y="82">Run A</text><text x="300" y="107">and B</text>
