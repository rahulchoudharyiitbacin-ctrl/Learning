  <text x="10" y="222" font-size="20" font-weight="700" letter-spacing="2" fill="#b8661a">ONLINE</text>
  <g font-size="21" fill="#1d262d" text-anchor="middle">
    <rect x="10" y="238" width="160" height="70" rx="10" fill="#f6e4cf" stroke="#b8661a"/><text x="90" y="270">Real</text><text x="90" y="295">users</text>
    <rect x="220" y="238" width="160" height="70" rx="10" fill="#f6e4cf" stroke="#b8661a"/><text x="300" y="270">Split:</text><text x="300" y="295">A or B</text>
