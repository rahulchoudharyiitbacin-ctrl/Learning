<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56616a"/></marker></defs>
  <g font-size="21" fill="#1d262d" text-anchor="middle">
    <rect x="10" y="8" width="580" height="56" rx="10" fill="#eef1f2" stroke="#c9d3d8"/><text x="300" y="34" font-weight="700">1. Read the experiment file</text><text x="300" y="56" font-size="17" fill="#56616a">prompts, test cases, settings</text>
    <rect x="10" y="94" width="580" height="56" rx="10" fill="#f6e4cf" stroke="#b8661a"/><text x="300" y="120" font-weight="700">2. Make the job list</text><text x="300" y="142" font-size="17" fill="#56616a">cases x variants x runs, shuffled</text>
    <rect x="10" y="180" width="580" height="56" rx="10" fill="#d3eeea" stroke="#13857a"/><text x="300" y="206" font-weight="700">3. Call the model, grade the answer</text><text x="300" y="228" font-size="17" fill="#56616a">a few calls in parallel</text>
    <rect x="10" y="266" width="580" height="56" rx="10" fill="#d3eeea" stroke="#13857a"/><text x="300" y="292" font-weight="700">4. Save one line per call</text><text x="300" y="314" font-size="17" fill="#56616a">output, grade, tokens, latency</text>
    <rect x="10" y="352" width="580" height="44" rx="10" fill="#ffffff" stroke="#56616a" stroke-width="2"/><text x="300" y="381" font-weight="700">5. Print the summary</text>
  </g>
  <path d="M300 66 V90 M300 152 V176 M300 238 V262 M300 324 V348" stroke="#56616a" stroke-width="3" fill="none" marker-end="url(#ar)"/>
</svg>
