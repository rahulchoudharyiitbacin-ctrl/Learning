<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56616a"/></marker></defs>
  <g font-size="21" fill="#1d262d" text-anchor="middle">
    <rect x="20" y="8" width="520" height="56" rx="10" fill="#eef1f2" stroke="#c9d3d8"/><text x="280" y="34" font-weight="700">Raw outputs</text><text x="280" y="56" font-size="17" fill="#56616a">read failures, disagreements, some passes</text>
    <rect x="60" y="94" width="440" height="56" rx="10" fill="#f6e4cf" stroke="#b8661a"/><text x="280" y="120" font-weight="700">Notes</text><text x="280" y="142" font-size="17" fill="#56616a">one line each, what you saw (open coding)</text>
    <rect x="100" y="180" width="360" height="56" rx="10" fill="#d3eeea" stroke="#13857a"/><text x="280" y="206" font-weight="700">Categories</text><text x="280" y="228" font-size="17" fill="#56616a">4 to 8 groups (axial coding)</text>
    <rect x="140" y="266" width="280" height="56" rx="10" fill="#d3eeea" stroke="#13857a"/><text x="280" y="292" font-weight="700">Counts</text><text x="280" y="314" font-size="17" fill="#56616a">which group is biggest?</text>
    <rect x="180" y="352" width="200" height="44" rx="10" fill="#ffffff" stroke="#56616a" stroke-width="2"/><text x="280" y="381" font-weight="700">Fix, then re-run</text>
  </g>
  <path d="M280 66 V90 M280 152 V176 M280 238 V262 M280 324 V348" stroke="#56616a" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M382 374 H570 V36 H546" stroke="#13857a" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#ar)"/>
  <text x="575" y="215" font-size="17" fill="#0b5e56" transform="rotate(90 575 215)" text-anchor="middle">repeat until nothing new appears</text>
</svg>
