  <path d="M440 66 L490 92" stroke="#56616a" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M105 154 V180" stroke="#56616a" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M300 154 V180" stroke="#56616a" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M495 154 V180" stroke="#56616a" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M495 242 V296" stroke="#56616a" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M190 212 H211" stroke="#56616a" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M385 212 H406" stroke="#56616a" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M408 328 H364" stroke="#13857a" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#ar)"/>
