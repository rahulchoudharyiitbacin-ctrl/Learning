<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" font-family="Helvetica, Arial, sans-serif">
  <text x="300" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1d262d">How often the interval caught the truth</text>
  <text x="300" y="56" text-anchor="middle" font-size="18" fill="#56616a">Simulated: 100 cases x 3 runs, 1,000 repeats</text>
  <line x1="502.0" y1="80" x2="502.0" y2="250" stroke="#1d262d" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="496.0" y="300" text-anchor="end" font-size="18" fill="#1d262d">dashed = 95% target</text>
  <text x="10" y="119" font-size="19" fill="#1d262d">Case t-interval</text>
  <line x1="230.0" y1="112" x2="570.0" y2="112" stroke="#eef1f2" stroke-width="2"/>
  <circle cx="492.5" cy="112" r="9" fill="#13857a"/>
  <text x="476.5" y="118" text-anchor="end" font-size="18" fill="#1d262d">94.3%</text>
  <text x="10" y="174" font-size="19" fill="#1d262d">Case bootstrap</text>
  <line x1="230.0" y1="167" x2="570.0" y2="167" stroke="#eef1f2" stroke-width="2"/>
  <circle cx="484.3" cy="167" r="9" fill="#13857a"/>
  <text x="468.3" y="173" text-anchor="end" font-size="18" fill="#1d262d">93.7%</text>
  <text x="10" y="229" font-size="19" fill="#1d262d">Rows independent</text>
  <line x1="230.0" y1="222" x2="570.0" y2="222" stroke="#eef1f2" stroke-width="2"/>
  <circle cx="300.7" cy="222" r="9" fill="#b8661a"/>
  <text x="316.7" y="228" text-anchor="start" font-size="18" fill="#1d262d">80.2%</text>
  <line x1="230.0" y1="250" x2="570.0" y2="250" stroke="#56616a" stroke-width="2"/>
  <line x1="230.0" y1="250" x2="230.0" y2="258" stroke="#56616a" stroke-width="2"/>
  <text x="230.0" y="277" text-anchor="middle" font-size="18" fill="#1d262d">75%</text>
  <line x1="298.0" y1="250" x2="298.0" y2="258" stroke="#56616a" stroke-width="2"/>
  <text x="298.0" y="277" text-anchor="middle" font-size="18" fill="#1d262d">80%</text>
  <line x1="366.0" y1="250" x2="366.0" y2="258" stroke="#56616a" stroke-width="2"/>
  <text x="366.0" y="277" text-anchor="middle" font-size="18" fill="#1d262d">85%</text>
  <line x1="434.0" y1="250" x2="434.0" y2="258" stroke="#56616a" stroke-width="2"/>
  <text x="434.0" y="277" text-anchor="middle" font-size="18" fill="#1d262d">90%</text>
  <line x1="502.0" y1="250" x2="502.0" y2="258" stroke="#56616a" stroke-width="2"/>
  <text x="502.0" y="277" text-anchor="middle" font-size="18" fill="#1d262d">95%</text>
  <line x1="570.0" y1="250" x2="570.0" y2="258" stroke="#56616a" stroke-width="2"/>
  <text x="570.0" y="277" text-anchor="middle" font-size="18" fill="#1d262d">100%</text>
</svg>
